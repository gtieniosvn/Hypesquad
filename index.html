<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HypeSquad Pro - TienDay Developer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0b0e13; color: #fff;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .box {
            background: #161b26; border: 1px solid #262d3d; border-radius: 16px;
            padding: 30px 24px; max-width: 420px; width: 100%; text-align: center;
        }
        .logo { font-size: 40px; margin-bottom: 10px; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        p { color: #8b95a7; font-size: 13px; margin-bottom: 20px; }
        input {
            width: 100%; padding: 14px; background: #1c2230;
            border: 2px solid #262d3d; border-radius: 10px; color: #fff;
            font-size: 14px; outline: none; margin-bottom: 12px;
            font-family: monospace;
        }
        input:focus { border-color: #5865f2; }
        button {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-weight: 700; font-size: 15px; cursor: pointer; color: #fff;
            background: #5865f2; margin-bottom: 8px;
        }
        button:hover { background: #4752c4; }
        button.red { background: #ef4444; }
        button.red:hover { background: #dc2626; }
        button:disabled { opacity: 0.5; cursor: wait; }
        .msg {
            padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600;
            display: none; margin-top: 8px;
        }
        .msg.ok { background: #065f46; color: #6ee7b7; display: block; }
        .msg.err { background: #7f1d1d; color: #fca5a5; display: block; }
        .info { font-size: 11px; color: #8b95a7; margin-top: 12px; }
        .link { color: #5865f2; cursor: pointer; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

<!-- ========== MÀN HÌNH NHẬP TOKEN ========== -->
<div class="box" id="loginScreen">
    <div class="logo">⚡</div>
    <h1>HypeSquad Pro</h1>
    <p>Nhập Token Discord để bắt đầu</p>
    <input type="password" id="tokenInput" placeholder="Dán token Discord vào đây..." autocomplete="off">
    <button id="btnLogin">🔓 MỞ KHÓA</button>
    <div class="msg" id="loginMsg"></div>
    <p class="info">
        <span class="link" onclick="alert('1. Mở Discord Web → F12 → Console\n2. Dán code:\n(webpackChunkdiscord_app.push([[\"\"],{},e=>{m=[];for(let c in e.c)m.push(e.c[c])}]),m).find(m=>m?.exports?.default?.getToken!==void 0).exports.default.getToken()\n3. Copy token → Dán vào đây')">📖 Cách lấy token</span>
    </p>
</div>

<!-- ========== MÀN HÌNH CHÍNH ========== -->
<div class="box hidden" id="mainScreen">
    <div class="logo">🏠</div>
    <h1 id="userName">...</h1>
    <p id="userBadge" style="color:#8b95a7">...</p>
    
    <div style="background:#1c2230;border-radius:10px;padding:12px;margin:12px 0;text-align:left">
        <b>🛡️ Đánh giá rủi ro:</b> <span id="riskLabel">...</span>
    </div>

    <p style="font-size:13px;font-weight:700;margin-bottom:8px">Chọn House:</p>
    <button onclick="selectHouse(1)" id="btn1" style="background:#9c84ef">🟣 Bravery</button>
    <button onclick="selectHouse(2)" id="btn2" style="background:#f47b67">🟠 Brilliance</button>
    <button onclick="selectHouse(3)" id="btn3" style="background:#3ecf8e">🟢 Balance</button>
    
    <button id="btnJoin" style="margin-top:12px">⚡ ĐỔI HUY HIỆU</button>
    <button class="red" id="btnLeave">🚫 Rời HypeSquad</button>
    
    <div class="msg" id="mainMsg"></div>
    
    <button class="red" id="btnLogout" style="margin-top:16px">🚪 Đăng xuất</button>
</div>

<script>
// ========== STATE ==========
let token = '';
let userData = null;
let house = null;

// ========== DOM ==========
const loginScreen = document.getElementById('loginScreen');
const mainScreen = document.getElementById('mainScreen');
const tokenInput = document.getElementById('tokenInput');
const loginMsg = document.getElementById('loginMsg');
const mainMsg = document.getElementById('mainMsg');

// ========== INIT ==========
const saved = localStorage.getItem('hs_token');
if (saved) { token = saved; tokenInput.value = saved; }

// ========== LOGIN ==========
document.getElementById('btnLogin').addEventListener('click', async function() {
    const btn = this;
    token = tokenInput.value.trim();
    if (!token) return showMsg(loginMsg, 'err', '❌ Vui lòng nhập Token');

    btn.disabled = true;
    btn.textContent = '⏳ Đang kiểm tra...';
    loginMsg.className = 'msg';

    try {
        const res = await fetch('https://discord.com/api/v9/users/@me', {
            headers: { 'Authorization': token }
        });

        if (res.ok) {
            userData = await res.json();
            localStorage.setItem('hs_token', token);
            showDashboard();
        } else if (res.status === 401) {
            showMsg(loginMsg, 'err', '❌ Token sai hoặc hết hạn');
        } else {
            showMsg(loginMsg, 'err', '❌ Lỗi ' + res.status);
        }
    } catch (e) {
        showMsg(loginMsg, 'err', '❌ Lỗi kết nối: ' + e.message);
    }

    btn.disabled = false;
    btn.textContent = '🔓 MỞ KHÓA';
});

// ========== DASHBOARD ==========
function showDashboard() {
    loginScreen.classList.add('hidden');
    mainScreen.classList.remove('hidden');

    const u = userData;
    document.getElementById('userName').textContent = u.global_name || u.username;
    
    // Badge
    let badge = '';
    if (u.premium_type === 2) badge += '💎 Nitro Full · ';
    else if (u.premium_type === 1) badge += '💎 Nitro Classic · ';
    if (u.flags & 256) badge += '🟣 Bravery';
    else if (u.flags & 128) badge += '🟠 Brilliance';
    else if (u.flags & 64) badge += '🟢 Balance';
    else badge += 'Chưa có HypeSquad';
    document.getElementById('userBadge').textContent = badge;

    // Risk
    const created = new Date(Math.floor(parseInt(u.id) / 4194304) + 1420070400000);
    const months = (Date.now() - created.getTime()) / (1000 * 60 * 60 * 24 * 30);
    let risk = '🟢 Thấp';
    if (months < 3) risk = '🔴 NGUY HIỂM - TK mới';
    else if (months < 6) risk = '🟠 Cao - TK < 6 tháng';
    else if (!u.email) risk = '🟡 Trung bình - Chưa có email';
    document.getElementById('riskLabel').textContent = risk;
}

// ========== SELECT HOUSE ==========
function selectHouse(id) {
    house = id;
    document.querySelectorAll('#mainScreen button[id^="btn"]').forEach(b => {
        if (b.id.startsWith('btn') && b.id.length === 4) b.style.opacity = '0.5';
    });
    document.getElementById('btn' + id).style.opacity = '1';
}

// ========== JOIN ==========
document.getElementById('btnJoin').addEventListener('click', async function() {
    if (!house) return showMsg(mainMsg, 'err', '❌ Chọn House trước!');
    const btn = this;
    btn.disabled = true; btn.textContent = '⏳ Đang đổi...';
    mainMsg.className = 'msg';

    try {
        const res = await fetch('https://discord.com/api/v9/hypesquad/online', {
            method: 'POST',
            headers: { 'Authorization': token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ house_id: house })
        });

        if (res.status === 204) {
            showMsg(mainMsg, 'ok', '✅ Thành công! Refresh Discord (Ctrl+R)');
        } else if (res.status === 401) {
            showMsg(mainMsg, 'err', '❌ Token hết hạn - Đăng xuất rồi đăng nhập lại');
        } else if (res.status === 403) {
            showMsg(mainMsg, 'err', '❌ Bị chặn (403) - Đổi mạng/VPN');
        } else {
            showMsg(mainMsg, 'err', '❌ Lỗi ' + res.status);
        }
    } catch (e) {
        showMsg(mainMsg, 'err', '❌ Lỗi: ' + e.message);
    }

    btn.disabled = false; btn.textContent = '⚡ ĐỔI HUY HIỆU';
});

// ========== LEAVE ==========
document.getElementById('btnLeave').addEventListener('click', async function() {
    if (!confirm('Rời HypeSquad?')) return;
    const btn = this;
    btn.disabled = true; btn.textContent = '⏳...';
    mainMsg.className = 'msg';

    try {
        const res = await fetch('https://discord.com/api/v9/hypesquad/online', {
            method: 'DELETE',
            headers: { 'Authorization': token }
        });
        showMsg(mainMsg, res.status === 204 ? 'ok' : 'err', res.status === 204 ? '✅ Đã rời!' : '❌ Lỗi ' + res.status);
    } catch (e) {
        showMsg(mainMsg, 'err', '❌ ' + e.message);
    }

    btn.disabled = false; btn.textContent = '🚫 Rời HypeSquad';
});

// ========== LOGOUT ==========
document.getElementById('btnLogout').addEventListener('click', function() {
    localStorage.removeItem('hs_token');
    token = ''; userData = null; house = null;
    loginScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
    tokenInput.value = '';
    loginMsg.className = 'msg';
});

// ========== ENTER KEY ==========
tokenInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('btnLogin').click();
});

function showMsg(el, type, text) {
    el.className = 'msg ' + type;
    el.textContent = text;
}
</script>

</body>
</html>
